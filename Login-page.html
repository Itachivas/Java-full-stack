<!DOCTYPE html>
<html lang="en">
<head>
    <title>simple login</title>
    <style>
        body{
            color:rgb(39, 89, 165);
background-color:rgb(204, 135, 241);
border:2px dashed rgb(12, 35, 12);

        }
        button {
    border: none;

    padding: 13px 28px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;

    transition: 0.3s;
}
    </style>
</head>
<body>
    <div class="login"> 
<h1>login</h1>
<form action="">
    <h4>username:<input type="text" id="user" place holder="username"></h4>
    <h4>password:<input type="password" id="pass" place holder="password"></h4>
    <button onclick="login(user.value,pass.value)">login</button>
</form>
    </div>
<script>function login(username,password)
{

}</script>
</body>
</html>
